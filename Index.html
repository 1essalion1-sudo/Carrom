<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrom</title>
<style>
:root{--bg:#e9e2d3;--fg:#1f2a2e;--card:#f7f3ea;--mut:#5d6b6f;--acc:#1f6f6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--fg:#e8eeee;--card:#1f2729;--mut:#93a3a6;--acc:#4fc3bb}}
:root[data-theme="dark"]{--bg:#14191b;--fg:#e8eeee;--card:#1f2729;--mut:#93a3a6;--acc:#4fc3bb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;gap:8px}
.p{flex:1;background:var(--card);border-radius:10px;padding:8px 12px;border:2px solid transparent}
.p.on{border-color:var(--acc)}
.p b{display:block;font-size:13px;color:var(--mut);font-weight:normal}
.p span{font-size:26px}
canvas{width:100%;aspect-ratio:1/1;touch-action:none;border-radius:8px;display:block}
#msg{min-height:2.6em;margin:0;font-size:15px;line-height:1.3}
.row{display:flex;align-items:center;gap:10px}
.row label{font-size:14px;color:var(--mut)}
input[type=range]{flex:1;accent-color:var(--acc)}
button{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="p on" id="h0"><b>Player 1 · White</b><span id="s0">0</span></div>
    <div class="p" id="h1"><b>Player 2 · Black</b><span id="s1">0</span></div>
  </div>
  <canvas id="c" width="600" height="600" aria-label="Carrom board"></canvas>
  <p id="msg"></p>
  <div class="row">
    <label for="pos">Striker position</label>
    <input type="range" id="pos" min="0" max="100" value="50">
    <button id="nb">New game</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const S=600,M=34,L=M,R=S-M,T=M,B=S-M,CR=13,SR=17,PR=24,BASE=B-50,TOP=T+50,MAXP=130,DEAD=30;
const baseY=()=>turn?TOP:BASE;
const pockets=[[L+6,T+6],[R-6,T+6],[L+6,B-6],[R-6,B-6]];
const $=id=>document.getElementById(id);
let coins,striker,turn,scores,phase,drag,over,got,sOut,pendingQ=null,pk=[0,0],lastPos=50;

function init(){
  coins=[{x:S/2,y:S/2,vx:0,vy:0,r:CR,m:1,t:'q'}];
  for(let i=0;i<6;i++){const a=i*Math.PI/3;coins.push({x:S/2+Math.cos(a)*28,y:S/2+Math.sin(a)*28,vx:0,vy:0,r:CR,m:1,t:i%2?'b':'w'});}
  for(let i=0;i<12;i++){const a=i*Math.PI/6+Math.PI/12;coins.push({x:S/2+Math.cos(a)*57,y:S/2+Math.sin(a)*57,vx:0,vy:0,r:CR,m:1,t:i%2?'w':'b'});}
  scores=[0,0];pk=[0,0];pendingQ=null;turn=0;over=false;lastPos=50;newStriker();hud();
  msg('Player 1: slide the striker, then drag back on the board and release to shoot. Release inside the dotted circle to cancel.');
}
const xOf=v=>L+50+(R-L-100)*v/100;
function ok(v){const x=xOf(v),y=baseY();return coins.every(c=>Math.hypot(c.x-x,c.y-y)>=SR+CR+1)}
function freeX(){
  const w=+$('pos').value;let v=w;
  for(let d=0;d<=100;d++){if(w+d<=100&&ok(w+d)){v=w+d;break}if(w-d>=0&&ok(w-d)){v=w-d;break}}
  $('pos').value=v;lastPos=v;return xOf(v);
}
function toCenter(t){
  for(let r=0;r<260;r+=14){
    const n=r?Math.round(2*Math.PI*r/14):1;
    for(let i=0;i<n;i++){
      const a=i/n*6.283,x=S/2+Math.cos(a)*r,y=S/2+Math.sin(a)*r;
      if(coins.every(c=>Math.hypot(c.x-x,c.y-y)>=2*CR+1)){coins.push({x,y,vx:0,vy:0,r:CR,m:1,t});return}
    }
  }
}
function newStriker(){
  striker={x:freeX(),y:baseY(),vx:0,vy:0,r:SR,m:2,t:'s'};
  phase='aim';got=[];sOut=false;drag=null;$('pos').disabled=false;
}
function msg(t){$('msg').textContent=t}
function hud(){
  $('s0').textContent=scores[0];$('s1').textContent=scores[1];
  $('h0').classList.toggle('on',turn===0&&!over);$('h1').classList.toggle('on',turn===1&&!over);
}
function bodies(){return phase==='move'?[striker,...coins]:coins}

function stepPhys(){
  const bs=bodies();
  for(let k=0;k<4;k++){
    for(const b of bs){
      b.x+=b.vx/4;b.y+=b.vy/4;
      b.vx*=0.9925;b.vy*=0.9925;
      if(b.x-b.r<L){b.x=L+b.r;b.vx=Math.abs(b.vx)*0.8}
      if(b.x+b.r>R){b.x=R-b.r;b.vx=-Math.abs(b.vx)*0.8}
      if(b.y-b.r<T){b.y=T+b.r;b.vy=Math.abs(b.vy)*0.8}
      if(b.y+b.r>B){b.y=B-b.r;b.vy=-Math.abs(b.vy)*0.8}
    }
    for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){
      const a=bs[i],c=bs[j];let dx=c.x-a.x,dy=c.y-a.y;const d=Math.hypot(dx,dy),md=a.r+c.r;
      if(d<md&&d>0.001){
        dx/=d;dy/=d;const ov=md-d,tm=a.m+c.m;
        a.x-=dx*ov*c.m/tm;a.y-=dy*ov*c.m/tm;c.x+=dx*ov*a.m/tm;c.y+=dy*ov*a.m/tm;
        const vn=(c.vx-a.vx)*dx+(c.vy-a.vy)*dy;
        if(vn<0){const j2=-(1.9)*vn/(1/a.m+1/c.m);
          a.vx-=j2*dx/a.m;a.vy-=j2*dy/a.m;c.vx+=j2*dx/c.m;c.vy+=j2*dy/c.m;}
      }
    }
    for(const b of bs.slice()){
      for(const p of pockets){
        if(Math.hypot(b.x-p[0],b.y-p[1])<PR){
          if(b===striker){sOut=true;striker.vx=striker.vy=0;striker.x=-999;}
          else{got.push(b.t);coins.splice(coins.indexOf(b),1);}
          bs.splice(bs.indexOf(b),1);break;
        }
      }
    }
  }
  let still=true;
  for(const b of bodies()){if(Math.hypot(b.vx,b.vy)<0.05){b.vx=b.vy=0}else still=false}
  if(sOut&&phase==='move'&&coins.every(b=>b.vx===0&&b.vy===0))still=true;
  if(still&&phase==='move')endTurn();
}

function endTurn(){
  let extra=false,note='';
  const q=got.includes('q'),own=got.some(t=>t!=='q'&&(t==='w'?0:1)===turn);
  if(sOut){
    got.slice().sort((a,b)=>(b==='q')-(a==='q')).forEach(toCenter);
    if(pendingQ!==null){toCenter('q');pendingQ=null}
    note='Foul! Pocketed coins go back to the center. ';
    if(pk[turn]>0){pk[turn]--;scores[turn]=Math.max(0,scores[turn]-1);toCenter(turn?'b':'w');note+='Player '+(turn+1)+' also returns one of their coins. '}
  }else{
    for(const t of got){if(t==='q')continue;const o=t==='w'?0:1;scores[o]++;pk[o]++;if(o===turn)extra=true}
    if(pendingQ!==null){
      if(own){scores[turn]+=3;extra=true;note='Queen covered, +3! '}
      else{toCenter('q');extra=false;note='Queen not covered, so it returns to the center. '}
      pendingQ=null;
    }else if(q){
      if(own){scores[turn]+=3;extra=true;note='Queen covered, +3! '}
      else{pendingQ=turn;extra=true;note='Queen down. Pocket one of your own coins to claim it. '}
    }
  }
  const w=coins.filter(c=>c.t==='w').length,k=coins.filter(c=>c.t==='b').length;
  if(w===0||k===0){
    over=true;phase='over';hud();
    const r=scores[0]===scores[1]?'It is a draw.':'Player '+(scores[0]>scores[1]?1:2)+' wins!';
    msg('Game over, '+scores[0]+' to '+scores[1]+'. '+r+' Press New game to play again.');return;
  }
  const prev=turn;if(!extra)turn=1-turn;
  hud();newStriker();
  if(!note&&extra)note='Pocketed one! Player '+(prev+1)+' shoots again. ';
  msg(note+'Player '+(turn+1)+' ('+(turn?'Black':'White')+'): your turn.');
}

function draw(){
  ctx.fillStyle='#6b4423';ctx.fillRect(0,0,S,S);
  ctx.fillStyle='#e3b878';ctx.fillRect(L,T,R-L,B-T);
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(S/2,S/2,70,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(S/2,S/2,6,0,7);ctx.stroke();
  const o=44;ctx.strokeRect(L+o,T+o,R-L-2*o,B-T-2*o);
  ctx.beginPath();ctx.moveTo(L+o,BASE);ctx.lineTo(R-o,BASE);ctx.moveTo(L+o,TOP);ctx.lineTo(R-o,TOP);ctx.stroke();
  for(const p of pockets){ctx.fillStyle='#16110c';ctx.beginPath();ctx.arc(p[0],p[1],PR,0,7);ctx.fill();}
  for(const c of coins){
    ctx.fillStyle=c.t==='w'?'#f6f1e4':c.t==='b'?'#2a2a2a':'#c0392b';
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=c.t==='b'?'rgba(255,255,255,.25)':'rgba(0,0,0,.2)';
    ctx.beginPath();ctx.arc(c.x,c.y,c.r*0.6,0,7);ctx.stroke();
  }
  if(!sOut){
    ctx.fillStyle='#2f7fd1';ctx.beginPath();ctx.arc(striker.x,striker.y,SR,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(striker.x,striker.y,SR*0.55,0,7);ctx.stroke();
  }
  if(drag&&phase==='aim'){
    let dx=drag.sx-drag.x,dy=drag.sy-drag.y;const l=Math.hypot(dx,dy);
    ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(drag.sx,drag.sy,DEAD,0,7);ctx.stroke();ctx.setLineDash([]);
    if(l>=DEAD){
      const pw=Math.min(l,MAXP),ux=dx/l,uy=dy/l,by=turn?striker.y-SR-14:striker.y+SR+8;
      ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(striker.x,striker.y);ctx.lineTo(striker.x+ux*(100+pw*2),striker.y+uy*(100+pw*2));ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(31,111,107,.9)';ctx.fillRect(striker.x-30,by,60*pw/MAXP,6);
      ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.strokeRect(striker.x-30,by,60,6);
    }
  }
}

function loop(){if(phase==='move')stepPhys();draw();requestAnimationFrame(loop)}

function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height}}
cv.addEventListener('pointerdown',e=>{
  if(phase!=='aim')return;
  const p=pt(e);drag={sx:p.x,sy:p.y,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{if(drag){const p=pt(e);drag.x=p.x;drag.y=p.y}});
function release(){
  if(!drag||phase!=='aim'){drag=null;return}
  const dx=drag.sx-drag.x,dy=drag.sy-drag.y,l=Math.hypot(dx,dy);drag=null;
  if(l<DEAD)return;
  const pw=Math.min(l,MAXP);
  striker.vx=dx/l*pw*0.2;striker.vy=dy/l*pw*0.2;
  phase='move';$('pos').disabled=true;
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape')drag=null});
$('pos').addEventListener('input',()=>{if(phase!=='aim')return;const v=+$('pos').value;if(ok(v)){lastPos=v;striker.x=xOf(v)}else $('pos').value=lastPos});
$('nb').addEventListener('click',()=>{$('pos').value=50;init()});

init();loop();
</script>
</body>
</html>
